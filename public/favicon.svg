<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E63946"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
  </defs>

  <!-- Fondo cuadrado con esquinas redondeadas -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Barra roja superior (acento editorial) -->
  <rect x="4" y="4" width="24" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Líneas de texto simuladas (noticias) -->
  <rect x="4" y="11" width="16" height="2.5" rx="1.2" fill="#FFFFFF"/>
  <rect x="4" y="15.5" width="24" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.45"/>
  <rect x="4" y="19" width="20" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.45"/>
  <rect x="4" y="22.5" width="22" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.3"/>

  <!-- Punto rojo (indicador de "en vivo" / breaking news) -->
  <circle cx="27" cy="12" r="2.5" fill="#E63946"/>
  <circle cx="27" cy="12" r="1.2" fill="#FF6B35"/>
</svg>
